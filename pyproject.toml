[project]
name = "nomad-events-to-slack"
version = "0.8.3"
description = "Forward Hashicorp Nomad allocation events to Slack"
authors = [{name = "DXCLABS LTD"}]
requires-python = ">=3.12,<3.13"

dependencies = [
    "python-consul2>=0.1.5,<0.2.0",
    "python-nomad>=2.0.0,<3.0.0",
    "requests>=2.33.0,<3.0.0",
]

[tool.commitizen]
name = "cz_customize"
version_scheme = "semver2"
version_provider = "pep621"
tag_format = "v$version"
bump_message = "bump: version $current_version → $new_version"
changelog_file = "docs/changelog.rst"
update_changelog_on_bump = true

[tool.commitizen.customize]
bump_pattern = "^(feat|fix|perf|refactor|build|BREAKING CHANGE)"
bump_map = {"^.+!" = "MAJOR", "BREAKING CHANGE" = "MAJOR", "^feat" = "MINOR", "^(fix|perf|refactor|build)" = "PATCH"}
schema_pattern = '(?s)(build|bump|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\(\S+\))?!?: ([^\n\r]+)((\n\n.*)|(\s*))?$'
message_template = "{{prefix}}{% if scope %}({{scope}}){% endif %}{% if is_breaking_change %}!{% endif %}: {{subject}}{% if body %}\n\n{{body}}{% endif %}"

[[tool.commitizen.customize.questions]]
type = "list"
name = "prefix"
message = "Select the type of change you are committing"
choices = [
    {value = "feat", name = "feat: A new feature"},
    {value = "fix", name = "fix: A bug fix"},
    {value = "docs", name = "docs: Documentation only changes"},
    {value = "style", name = "style: Changes that do not affect the meaning of the code"},
    {value = "refactor", name = "refactor: A code change that neither fixes a bug nor adds a feature"},
    {value = "perf", name = "perf: A code change that improves performance"},
    {value = "test", name = "test: Adding missing or correcting existing tests"},
    {value = "build", name = "build: Changes that affect the build system or external dependencies"},
    {value = "ci", name = "ci: Changes to CI configuration files and scripts"},
    {value = "chore", name = "chore: Other changes that do not modify src or test files"},
    {value = "revert", name = "revert: Reverts a previous commit"},
]

[[tool.commitizen.customize.questions]]
type = "input"
name = "scope"
message = "Scope (optional, press [enter] to skip): "

[[tool.commitizen.customize.questions]]
type = "confirm"
name = "is_breaking_change"
message = "Is this a breaking change?"
default = false

[[tool.commitizen.customize.questions]]
type = "input"
name = "subject"
message = "Subject (short imperative summary): "

[[tool.commitizen.customize.questions]]
type = "input"
name = "body"
message = "Body (optional, press [enter] to skip): "

[tool.pytest.ini_options]
pythonpath = [".", "src"]
markers = [
    "integration: mark test as integration test requiring external resources",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
  "A", "ANN", "ARG", "B", "BLE001", "C4", "C90", "DTZ", "E", "EXE", "F",
  "FBT", "G", "I", "INT", "ISC", "PTH", "Q", "RSE", "RET", "S", "SIM",
  "SLF", "T10", "T20", "UP"
]
ignore = ["ISC001"]

unfixable = ["B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "ANN001", "ANN003", "ANN201", "ANN202", "F841", "S101", "S106", "SLF001", "SIM117"]

[tool.ty.environment]
root = [".", "src"]

[tool.deptry.package_module_name_map]
python-consul2 = ["consul"]
python-nomad = ["nomad"]

[dependency-groups]
types = [
]

linters = [
    "codespell>=2.4.1,<3.0.0",
    "deptry>=0.25.1,<0.26.0",
    "pyupgrade>=3.20.0,<4.0.0",
    "ruff>=0.15.21,<0.16.0",
    "ty>=0.0.35",
]
tests = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
]
dev = [
    "commitizen>=4.13.9,<5.0.0",
]
