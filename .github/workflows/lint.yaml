name: lint

on:
  pull_request:
    branches:
      - master

jobs:
  lint_python:

    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: [3.12.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system --requirements requirements.txt
          uv pip install --system --requirements requirements.linters.txt

      - run: shopt -s globstar && pyupgrade --py312-plus **/*.py

      - run: ruff format --diff .

      - run: codespell . --ignore-words .codespellignore

      - run: deptry .
